name: Archived Upstream Provenance

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-archive:
    name: Verify Software Heritage snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out libsqfs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the archived upstream master
        run: .github/ci/check-provenance.py
