name: Trixie CI

on:
  push:
    branches:
      - abuild-gh
  pull_request:
    branches:
      - abuild-gh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trixie-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out libsqfs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the GitHub-only overlay
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify refs/remotes/origin/abuild
          git merge-base --is-ancestor origin/abuild HEAD
          unexpected=$(
            git diff --name-only origin/abuild...HEAD |
              grep -Ev '^\.github/' || true
          )
          if test -n "$unexpected"; then
            echo "abuild-gh contains changes outside .github/:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Run Trixie and sanitizer checks
        run: .github/ci/run .github/ci/check

      - name: Publish the source coverage summary
        if: always()
        shell: bash
        run: |
          if test -s doc/coverage/summary.txt; then
            {
              echo '### libsqfs source coverage'
              echo '```text'
              cat doc/coverage/summary.txt
              echo '```'
              echo 'Coverage is informative; no threshold is enforced.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the source coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-coverage
          path: doc/coverage/
          if-no-files-found: error
          retention-days: 7
